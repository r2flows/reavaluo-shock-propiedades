[project]
name = "reavaluo-shock-propiedades"
version = "0.1.0"
description = "Brecha avalúo–mercado y oportunidades inmobiliarias (piloto Gran Santiago)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
