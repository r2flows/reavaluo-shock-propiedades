[project]
name = "reavaluo-shock-propiedades"
version = "0.1.0"
description = "Brecha avalúo–mercado y oportunidades inmobiliarias (piloto Gran Santiago)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=2.0",
    "shapely>=2.0",
    "pyfixest>=0.30",
    "rdrobust>=1.3",
    "rddensity>=2.6",
]

[dependency-groups]
dev = ["pytest>=8"]
# Servicio privado de pre-informes de títulos (src/titulos/app.py)
servicio = ["fastapi==0.115.6", "uvicorn==0.32.1", "python-multipart==0.0.20", "pypdf==5.1.0", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
